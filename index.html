<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>US500 AI Sniper Bot (1H)</title>
    <style>
        :root {
            --card-bg: rgba(15, 20, 32, 0.88);
            --border-color: rgba(64, 128, 255, 0.3);
            --text-main: #f0f3f6;
            --text-dim: #9598a1;
            --accent-green: #00ffcc;
            --accent-red: #ff3366;
            --accent-blue: #00bfff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #02040a;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* --- BRIGHT & STUNNING VIBRANT ANIMATED BACKGROUND --- */
        .animated-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #050b18 0%, #0c1b33 50%, #1a0b2e 100%);
            z-index: -3;
        }

        /* Glowing trading grid lines */
        .grid-overlay {
            position: absolute;
            width: 100vw;
            height: 100vh;
            background-image: 
                linear-gradient(rgba(0, 191, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 191, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -2;
        }

        /* Floating vibrant neon orbs */
        .neon-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.5;
            animation: orbFloat 10s infinite alternate ease-in-out;
            z-index: -2;
        }

        .orb-1 {
            width: 350px;
            height: 350px;
            background: rgba(0, 191, 255, 0.4);
            top: -50px;
            left: -50px;
        }

        .orb-2 {
            width: 400px;
            height: 400px;
            background: rgba(255, 51, 102, 0.25);
            bottom: -80px;
            right: -80px;
            animation-delay: -5s;
        }

        @keyframes orbFloat {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(40px) scale(1.15); }
        }

        /* --- TERMINAL GLASS CONTAINER --- */
        .terminal-container {
            width: 100%;
            max-width: 680px;
            background-color: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 25px rgba(0, 191, 255, 0.2);
            overflow: hidden;
            z-index: 1;
        }

        .header {
            background: linear-gradient(90deg, #121c2e, #1a2942);
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .header h1 {
            font-size: 1.15rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.5px;
            text-shadow: 0 0 10px rgba(0, 191, 255, 0.5);
        }

        .mt5-timer-box {
            background: rgba(0, 191, 255, 0.15);
            border: 1px solid var(--accent-blue);
            padding: 6px 14px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 1rem;
            color: #33d6ff;
            font-weight: bold;
            box-shadow: 0 0 12px rgba(0, 191, 255, 0.4);
        }

        .content {
            padding: 22px;
        }

        .status-banner {
            padding: 14px 18px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }

        .status-scanning {
            background: rgba(255, 170, 0, 0.15);
            border: 1px solid #ffaa00;
            color: #ffcc00;
            box-shadow: 0 0 15px rgba(255, 170, 0, 0.2);
        }

        .status-holding {
            background: rgba(0, 255, 204, 0.15);
            border: 1px solid var(--accent-green);
            color: var(--accent-green);
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
        }

        /* 3-Column Metrics Grid for Entry, SL, TP clarity */
        .grid-metrics {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .metric-card {
            background: rgba(20, 28, 45, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px;
            border-radius: 10px;
            text-align: center;
        }

        .metric-label {
            font-size: 0.7rem;
            color: var(--text-dim);
            text-transform: uppercase;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }

        .metric-value {
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
        }

        .main-price-card {
            background: linear-gradient(135deg, rgba(0, 191, 255, 0.1), rgba(20, 28, 45, 0.9));
            border: 1px solid var(--accent-blue);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .signal-display-box {
            background: rgba(10, 14, 24, 0.9);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 20px;
            text-align: center;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.5);
        }

        .signal-title {
            font-size: 0.75rem;
            color: var(--text-dim);
            margin-bottom: 6px;
            letter-spacing: 1px;
        }

        .signal-action {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .buy-color { color: var(--accent-green); text-shadow: 0 0 15px rgba(0, 255, 204, 0.6); }
        .neutral-color { color: var(--text-main); }

        .controls {
            display: flex;
            gap: 12px;
        }

        button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95rem;
        }

        button:hover {
            transform: translateY(-2px);
            filter: brightness(1.2);
        }

        .btn-sim-signal {
            background: linear-gradient(135deg, #00bfff, #0066ff);
            color: white;
            box-shadow: 0 5px 20px rgba(0, 191, 255, 0.4);
        }

        .btn-reset {
            background-color: #212c42;
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .footer-note {
            margin-top: 18px;
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-dim);
        }
    </style>
</head>
<body>

    <!-- Vibrant Animated Background Environment -->
    <div class="animated-bg"></div>
    <div class="grid-overlay"></div>
    <div class="neon-orb orb-1"></div>
    <div class="neon-orb orb-2"></div>

    <!-- Main Terminal Dashboard -->
    <div class="terminal-container">
        <!-- Header with MT5 Countdown -->
        <div class="header">
            <h1>US500 AI Sniper Bot (1H)</h1>
            <div class="mt5-timer-box" id="mt5-timer">00:00:00</div>
        </div>

        <div class="content">
            <!-- Bot Status Banner -->
            <div id="status-banner" class="status-banner status-scanning">
                <span>Status: SCANNING MARKET SNIPER ZONES</span>
                <span id="state-badge">SEARCHING</span>
            </div>

            <!-- Main Index Price Banner -->
            <div class="main-price-card">
                <div>
                    <div class="metric-label">US500 Index Live Price</div>
                    <div class="metric-value" id="current-price" style="font-size: 1.5rem; color: #00ffcc;">7,689.24</div>
                </div>
                <div style="text-align: right;">
                    <div class="metric-label">Market Bias</div>
                    <div class="metric-value" id="market-bias" style="color: #33d6ff;">BULLISH 📈</div>
                </div>
            </div>

            <!-- Clear Entry, SL, TP Metrics Grid -->
            <div class="grid-metrics">
                <div class="metric-card">
                    <div class="metric-label">Entry Price</div>
                    <div class="metric-value" id="entry-value" style="color: #00bfff;">--</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Stop Loss (SL)</div>
                    <div class="metric-value" id="sl-value" style="color: #ff3366;">--</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Take Profit (TP)</div>
                    <div class="metric-value" id="tp-value" style="color: #00ffcc;">--</div>
                </div>
            </div>

            <!-- Core Display Box -->
            <div class="signal-display-box">
                <div class="signal-title">ACTIVE DISPLAY / SIGNAL</div>
                <div class="signal-action neutral-color" id="signal-display">SCANNING FOR SETUP...</div>
            </div>

            <!-- Interactive Buttons -->
            <div class="controls">
                <button class="btn-sim-signal" onclick="triggerSniperEntry()">Simulate Sniper Entry</button>
                <button class="btn-reset" onclick="resetBotState()">Reset / Scan Mode</button>
            </div>

            <div class="footer-note">
                Strict 1H timeframe logic. Audio PIP active on TP/SL trigger.
            </div>
        </div>
    </div>

    <script>
        // Web Audio API Sound Generator for PIP Effect
        function playPipSound(isSuccess) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                osc.type = isSuccess ? 'triangle' : 'sawtooth';
                osc.frequency.setValueAtTime(isSuccess ? 880 : 300, audioCtx.currentTime); // High pitch for TP, low for SL
                
                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
                
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            } catch (e) {
                console.log("Audio context blocked until user interaction.");
            }
        }

        // Bot State Variables
        let inPosition = false;
        let livePrice = 7689.24;
        let lockedEntry = 0.00;
        let stopLoss = 0.00;
        let takeProfit = 0.00;

        // MT5 Style 1-Hour Candle Countdown Simulation
        function getSecondsToNextHour() {
            const now = new Date();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();
            return ((59 - minutes) * 60) + (60 - seconds);
        }

        let countdownSeconds = getSecondsToNextHour();

        function updateCountdownTimer() {
            let hours = Math.floor(countdownSeconds / 3600);
            let minutes = Math.floor((countdownSeconds % 3600) / 60);
            let seconds = countdownSeconds % 60;

            let formatted = 
                String(hours).padStart(2, '0') + ":" +
                String(minutes).padStart(2, '0') + ":" +
                String(seconds).padStart(2, '0');

            document.getElementById('mt5-timer').innerText = formatted;

            if (countdownSeconds > 0) {
                countdownSeconds--;
            } else {
                countdownSeconds = 3600;
            }
        }

        setInterval(updateCountdownTimer, 1000);
        updateCountdownTimer();

        // Live Price Ticker Simulation matching MT5 levels (~7689)
        setInterval(() => {
            let fluctuation = (Math.random() * 2 - 1).toFixed(2);
            livePrice = parseFloat((livePrice + parseFloat(fluctuation)).toFixed(2));
            
            document.getElementById('current-price').innerText = livePrice.toLocaleString();

            if (inPosition) {
                if (livePrice >= takeProfit) {
                    playPipSound(true); // Success PIP sound
                    triggerClose("🎯 TAKE PROFIT HIT! Bot resetting...");
                } else if (livePrice <= stopLoss) {
                    playPipSound(false); // Warning PIP sound
                    triggerClose("🛑 STOP LOSS HIT! Bot resetting...");
                }
            }
        }, 2000);

        function triggerSniperEntry() {
            inPosition = true;
            lockedEntry = livePrice;
            
            stopLoss = parseFloat((lockedEntry - 25.00).toFixed(2));     // 25 points Risk
            takeProfit = parseFloat((lockedEntry + 75.00).toFixed(2));   // 75 points Reward (1:3)

            let banner = document.getElementById('status-banner');
            banner.className = "status-banner status-holding";
            banner.querySelector("span").innerText = "Status: POSITION LOCKED ACTIVE (HOLDING)";
            document.getElementById('state-badge').innerText = "ACTIVE TRADE";

            document.getElementById('entry-value').innerText = lockedEntry.toLocaleString();
            document.getElementById('sl-value').innerText = stopLoss.toLocaleString();
            document.getElementById('tp-value').innerText = takeProfit.toLocaleString();

            let signalBox = document.getElementById('signal-display');
            signalBox.className = "signal-action buy-color";
            signalBox.innerText = "HOLD LONG (Monitoring TP/SL)";
        }

        function triggerClose(message) {
            inPosition = false;
            let signalBox = document.getElementById('signal-display');
            signalBox.className = "signal-action neutral-color";
            signalBox.innerText = message;

            setTimeout(resetBotState, 4000);
        }

        function resetBotState() {
            inPosition = false;
            let banner = document.getElementById('status-banner');
            banner.className = "status-banner status-scanning";
            banner.querySelector("span").innerText = "Status: SCANNING MARKET SNIPER ZONES";
            document.getElementById('state-badge').innerText = "SEARCHING";

            document.getElementById('entry-value').innerText = "--";
            document.getElementById('sl-value').innerText = "--";
            document.getElementById('tp-value').innerText = "--";

            let signalBox = document.getElementById('signal-display');
            signalBox.className = "signal-action neutral-color";
            signalBox.innerText = "SCANNING FOR SETUP...";
        }
    </script>
</body>
</html>
