<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>US500 AI Sniper Swing Bot (1H)</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #131722;
            --border-color: #2a2e39;
            --text-main: #d1d4dc;
            --text-dim: #787b86;
            --accent-green: #089981;
            --accent-red: #f23645;
            --accent-blue: #2962ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .terminal-container {
            width: 100%;
            max-width: 650px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .header {
            background-color: #1e222d;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .header h1 {
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
            letter-spacing: 0.5px;
        }

        .mt5-timer-box {
            background: rgba(41, 98, 255, 0.15);
            border: 1px solid var(--accent-blue);
            padding: 5px 12px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.95rem;
            color: #64b5f6;
            font-weight: bold;
        }

        .content {
            padding: 20px;
        }

        .status-banner {
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-scanning {
            background: rgba(255, 152, 0, 0.1);
            border: 1px solid #ffb74d;
            color: #ffb74d;
        }

        .status-holding {
            background: rgba(8, 153, 129, 0.1);
            border: 1px solid var(--accent-green);
            color: var(--accent-green);
        }

        .grid-metrics {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .metric-card {
            background: #1e222d;
            border: 1px solid var(--border-color);
            padding: 12px 15px;
            border-radius: 8px;
        }

        .metric-label {
            font-size: 0.75rem;
            color: var(--text-dim);
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .metric-value {
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
        }

        .signal-display-box {
            background: #181c25;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
        }

        .signal-title {
            font-size: 0.8rem;
            color: var(--text-dim);
            margin-bottom: 5px;
        }

        .signal-action {
            font-size: 1.4rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .buy-color { color: var(--accent-green); }
        .sell-color { color: var(--accent-red); }
        .neutral-color { color: var(--text-main); }

        .controls {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.85;
        }

        .btn-sim-signal {
            background-color: var(--accent-blue);
            color: white;
        }

        .btn-reset {
            background-color: #2a2e39;
            color: var(--text-main);
        }

        .footer-note {
            margin-top: 15px;
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-dim);
        }
    </style>
</head>
<body>

    <div class="terminal-container">
        <!-- Header with MT5 Countdown -->
        <div class="header">
            <h1>US500 AI Sniper Bot (1H)</h1>
            <div class="mt5-timer-box" id="mt5-timer">00:00:00</div>
        </div>

        <div class="content">
            <!-- Bot Status Banner -->
            <div id="status-banner" class="status-banner status-scanning">
                <span>Status: SCANNING MARKET SNIPER ZONES</span>
                <span id="state-badge">SEARCHING</span>
            </div>

            <!-- Metrics Grid -->
            <div class="grid-metrics">
                <div class="metric-card">
                    <div class="metric-label">US500 Index Price</div>
                    <div class="metric-value" id="current-price">5,842.50</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Market Bias</div>
                    <div class="metric-value" id="market-bias">BULLISH 📈</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Stop Loss (SL)</div>
                    <div class="metric-value" id="sl-value">--</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Take Profit (TP)</div>
                    <div class="metric-value" id="tp-value">--</div>
                </div>
            </div>

            <!-- Core Display Box -->
            <div class="signal-display-box">
                <div class="signal-title">ACTIVE DISPLAY / SIGNAL</div>
                <div class="signal-action neutral-color" id="signal-display">SCANNING FOR SETUP...</div>
            </div>

            <!-- Interactive Buttons -->
            <div class="controls">
                <button class="btn-sim-signal" onclick="triggerSniperEntry()">Simulate Sniper Entry</button>
                <button class="btn-reset" onclick="resetBotState()">Reset / Scan Mode</button>
            </div>

            <div class="footer-note">
                Strict 1H timeframe logic. Locks trade & holds until TP or SL is breached.
            </div>
        </div>
    </div>

    <script>
        // Bot State Variables
        let inPosition = false;
        let entryPrice = 5840.00;
        let stopLoss = 5815.00;
        let takeProfit = 5915.00; // 1:3 RR

        // MT5 Style 1-Hour Candle Countdown Simulation
        function getSecondsToNextHour() {
            const now = new Date();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();
            const totalSecsRemaining = ((59 - minutes) * 60) + (60 - seconds);
            return totalSecsRemaining;
        }

        let countdownSeconds = getSecondsToNextHour();

        function updateCountdownTimer() {
            let hours = Math.floor(countdownSeconds / 3600);
            let minutes = Math.floor((countdownSeconds % 3600) / 60);
            let seconds = countdownSeconds % 60;

            let formatted = 
                String(hours).padStart(2, '0') + ":" +
                String(minutes).padStart(2, '0') + ":" +
                String(seconds).padStart(2, '0');

            document.getElementById('mt5-timer').innerText = formatted;

            if (countdownSeconds > 0) {
                countdownSeconds--;
            } else {
                countdownSeconds = 3600; // Reset for next 1H candle
            }
        }

        setInterval(updateCountdownTimer, 1000);
        updateCountdownTimer();

        // Simulate Price Micro-fluctuations & TP/SL checks
        setInterval(() => {
            // Random fluctuation for US500 price simulation
            let fluctuation = (Math.random() * 4 - 2).toFixed(2);
            entryPrice = parseFloat((entryPrice + parseFloat(fluctuation)).toFixed(2));
            document.getElementById('current-price').innerText = entryPrice.toLocaleString();

            if (inPosition) {
                // Check if TP or SL is hit automatically
                if (entryPrice >= takeProfit) {
                    triggerClose("🎯 TAKE PROFIT HIT! Bot resetting...");
                } else if (entryPrice <= stopLoss) {
                    triggerClose("🛑 STOP LOSS HIT! Bot resetting...");
                }
            }
        }, 2000);

        function triggerSniperEntry() {
            inPosition = true;
            stopLoss = parseFloat((entryPrice - 25.00).toFixed(2));
            takeProfit = parseFloat((entryPrice + 75.00).toFixed(2)); // 1:3 RR

            // Update UI for HOLD state
            let banner = document.getElementById('status-banner');
            banner.className = "status-banner status-holding";
            banner.querySelector("span").innerText = "Status: POSITION LOCKED (HOLDING)";
            document.getElementById('state-badge').innerText = "ACTIVE TRADE";

            document.getElementById('sl-value').innerText = stopLoss;
            document.getElementById('tp-value').innerText = takeProfit;

            let signalBox = document.getElementById('signal-display');
            signalBox.className = "signal-action buy-color";
            signalBox.innerText = "HOLD LONG (Monitoring TP/SL)";
        }

        function triggerClose(message) {
            inPosition = false;
            let signalBox = document.getElementById('signal-display');
            signalBox.className = "signal-action neutral-color";
            signalBox.innerText = message;

            setTimeout(resetBotState, 4000);
        }

        function resetBotState() {
            inPosition = false;
            let banner = document.getElementById('status-banner');
            banner.className = "status-banner status-scanning";
            banner.querySelector("span").innerText = "Status: SCANNING MARKET SNIPER ZONES";
            document.getElementById('state-badge').innerText = "SEARCHING";

            document.getElementById('sl-value').innerText = "--";
            document.getElementById('tp-value').innerText = "--";

            let signalBox = document.getElementById('signal-display');
            signalBox.className = "signal-action neutral-color";
            signalBox.innerText = "SCANNING FOR SETUP...";
        }
    </script>
</body>
</html>
