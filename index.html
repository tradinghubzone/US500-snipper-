<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>US500 AI Sniper Bot (1H)</title>
    <style>
        :root {
            --card-bg: rgba(12, 18, 32, 0.88);
            --border-color: rgba(0, 191, 255, 0.4);
            --text-main: #f0f3f6;
            --text-dim: #9598a1;
            --accent-green: #00ffcc;
            --accent-red: #ff3366;
            --accent-blue: #00bfff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #020617;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* --- VIBRANT SKY-BLUE & TRADING ANIMATED BACKGROUND --- */
        .animated-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #02203c 0%, #081226 50%, #030712 100%);
            z-index: -3;
        }

        /* Floating Animated Emojis & Market Symbols */
        .floating-emoji {
            position: absolute;
            font-size: 24px;
            pointer-events: none;
            animation: floatEmoji 7s infinite linear;
            z-index: -2;
            opacity: 0.7;
        }

        @keyframes floatEmoji {
            0% { transform: translateY(105vh) rotate(0deg); opacity: 0; }
            20% { opacity: 0.8; }
            80% { opacity: 0.8; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        /* Glowing neon gradient orbs */
        .neon-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: orbFloat 10s infinite alternate ease-in-out;
            z-index: -2;
        }
        .orb-1 { width: 400px; height: 400px; background: rgba(0, 191, 255, 0.35); top: -100px; left: -100px; }
        .orb-2 { width: 450px; height: 450px; background: rgba(255, 51, 102, 0.2); bottom: -100px; right: -100px; animation-delay: -5s; }

        @keyframes orbFloat {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(30px) scale(1.1); }
        }

        /* --- CUTE FURRY CHARACTER PEEKING FROM CORNER --- */
        .peeking-creature {
            position: absolute;
            bottom: -10px;
            right: 25px;
            width: 110px;
            height: 110px;
            background: radial-gradient(circle at 50% 35%, #ff9800, #d84315);
            border-radius: 50% 50% 15% 15%;
            box-shadow: 0 0 25px rgba(255, 152, 0, 0.5);
            z-index: 2;
            animation: peekAnim 4s ease-in-out infinite alternate;
        }
        .peeking-creature::before, .peeking-creature::after {
            content: '';
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
            width: 36px;
            height: 42px;
            top: 25px;
        }
        .peeking-creature::before { left: 14px; }
        .peeking-creature::after { right: 14px; }

        .creature-pupil {
            position: absolute;
            background: #000;
            border-radius: 50%;
            width: 14px;
            height: 18px;
            top: 36px;
            animation: lookAround 5s infinite;
        }
        .pupil-l { left: 25px; }
        .pupil-r { right: 25px; }

        @keyframes peekAnim {
            0% { transform: translateY(12px); }
            100% { transform: translateY(-4px) rotate(1deg); }
        }
        @keyframes lookAround {
            0%, 100% { transform: translate(0,0); }
            40% { transform: translate(2px, -2px); }
            80% { transform: translate(-2px, 2px); }
        }

        /* --- TERMINAL GLASS CONTAINER --- */
        .terminal-container {
            width: 100%;
            max-width: 660px;
            background-color: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 25px rgba(0, 191, 255, 0.25);
            overflow: hidden;
            z-index: 1;
        }

        .header {
            background: linear-gradient(90deg, #101c30, #172a48);
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .header h1 {
            font-size: 1.15rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 10px rgba(0, 191, 255, 0.6);
        }

        .mt5-timer-box {
            background: rgba(0, 191, 255, 0.15);
            border: 1px solid var(--accent-blue);
            padding: 6px 14px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 1rem;
            color: #33d6ff;
            font-weight: bold;
            box-shadow: 0 0 12px rgba(0, 191, 255, 0.4);
        }

        .content {
            padding: 22px;
        }

        .status-banner {
            padding: 14px 18px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }

        .status-scanning {
            background: rgba(255, 170, 0, 0.15);
            border: 1px solid #ffaa00;
            color: #ffcc00;
            box-shadow: 0 0 15px rgba(255, 170, 0, 0.2);
        }

        .status-holding {
            background: rgba(0, 255, 204, 0.15);
            border: 1px solid var(--accent-green);
            color: var(--accent-green);
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
        }

        .main-price-card {
            background: linear-gradient(135deg, rgba(0, 191, 255, 0.1), rgba(15, 23, 42, 0.9));
            border: 1px solid var(--accent-blue);
            padding: 14px 18px;
            border-radius: 10px;
            margin-bottom: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .metric-label {
            font-size: 0.7rem;
            color: var(--text-dim);
            text-transform: uppercase;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }

        .metric-value {
            font-size: 1.1rem;
            font-weight: 700;
            color: #fff;
        }

        .grid-metrics {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 18px;
        }

        .metric-card {
            background: rgba(18, 26, 43, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px;
            border-radius: 10px;
            text-align: center;
        }

        .signal-display-box {
            background: rgba(8, 12, 22, 0.95);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 18px;
            text-align: center;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.6);
        }

        .signal-title {
            font-size: 0.75rem;
            color: var(--text-dim);
            margin-bottom: 6px;
            letter-spacing: 1px;
        }

        .signal-action {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .buy-color { color: var(--accent-green); text-shadow: 0 0 15px rgba(0, 255, 204, 0.6); }
        .neutral-color { color: var(--text-main); }

        .controls {
            display: flex;
            gap: 12px;
        }

        button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95rem;
        }

        button:hover {
            transform: translateY(-2px);
            filter: brightness(1.2);
        }

        .btn-sim-signal {
            background: linear-gradient(135deg, #00bfff, #0066ff);
            color: white;
            box-shadow: 0 5px 20px rgba(0, 191, 255, 0.4);
        }

        .btn-reset {
            background-color: #1e293b;
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .footer-note {
            margin-top: 15px;
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-dim);
        }
    </style>
</head>
