<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>US500 AI Sniper Bot (1H)</title>
    <style>
        :root {
            --card-bg: rgba(19, 23, 34, 0.85);
            --border-color: rgba(42, 46, 57, 0.8);
            --text-main: #d1d4dc;
            --text-dim: #787b86;
            --accent-green: #089981;
            --accent-red: #f23645;
            --accent-blue: #2962ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #05080f;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* --- ANIMATED CHARACTER & BACKGROUND ENVIRONMENT --- */
        .animated-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at 50% 30%, #0d2233 0%, #050b14 70%);
            z-index: -2;
        }

        /* Floating fur/glow particles matching character vibe */
        .particle {
            position: absolute;
            background: rgba(255, 152, 0, 0.15);
            border-radius: 50%;
            pointer-events: none;
            animation: floatUp 8s infinite linear;
            z-index: -1;
        }

        @keyframes floatUp {
            0% { transform: translateY(105vh) scale(0.5); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }

        /* Animated character peeking from bottom corner */
        .peeking-character {
            position: absolute;
            bottom: -20px;
            right: 20px;
            width: 130px;
            height: 130px;
            background: radial-gradient(circle at 50% 40%, #ff9800, #e65100);
            border-radius: 50% 50% 20% 20%;
            box-shadow: 0 0 30px rgba(255, 152, 0, 0.4);
            z-index: -1;
            animation: peekBounce 4s ease-in-out infinite alternate;
        }

        .peeking-character::before, .peeking-character::after {
            content: '';
            position: absolute;
            background: white;
            border-radius: 50%;
            width: 42px;
            height: 48px;
            top: 30px;
        }

        .peeking-character::before { left: 18px; }
        .peeking-character::after { right: 18px; }

        .eye-pupil {
            position: absolute;
            background: #111;
            border-radius: 50%;
            width: 18px;
            height: 22px;
            top: 43px;
            animation: lookAround 6s infinite;
        }

        .pupil-left { left: 30px; }
        .pupil-right { right: 30px; }

        @keyframes peekBounce {
            0% { transform: translateY(15px); }
            100% { transform: translateY(-5px) rotate(2deg); }
        }

        @keyframes lookAround {
            0%, 100% { transform: translate(0, 0); }
            30% { transform: translate(3px, -2px); }
            70% { transform: translate(-3px, 2px); }
        }

        /* --- TERMINAL GLASS CONTAINER --- */
        .terminal-container {
            width: 100%;
            max-width: 650px;
            background-color: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            overflow: hidden;
            z-index: 1;
        }

        .header {
            background-color: rgba(30, 34, 45, 0.9);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .header h1 {
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
            letter-spacing: 0.5px;
        }

        .mt5-timer-box {
            background: rgba(41, 98, 255, 0.2);
            border: 1px solid var(--accent-blue);
            padding: 5px 12px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.95rem;
            color: #64b5f6;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(41, 98, 255, 0.3);
        }

        .content {
            padding: 20px;
        }

        .status-banner {
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }

        .status-scanning {
            background: rgba(255, 152, 0, 0.12);
            border: 1px solid #ffb74d;
            color: #ffb74d;
        }

        .status-holding {
            background: rgba(8, 153, 129, 0.15);
            border: 1px solid var(--accent-green);
            color: var(--accent-green);
            box-shadow: 0 0 15px rgba(8, 153, 129, 0.2);
        }

        .grid-metrics {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .metric-card {
            background: rgba(30, 34, 45, 0.7);
            border: 1px solid var(--border-color);
            padding: 12px 15px;
            border-radius: 8px;
        }

        .metric-label {
            font-size: 0.75rem;
            color: var(--text-dim);
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .metric-value {
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
        }

        .signal-display-box {
            background: rgba(24, 28, 37, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
        }

        .signal-title {
            font-size: 0.8rem;
            color: var(--text-dim);
            margin-bottom: 5px;
        }

        .signal-action {
            font-size: 1.4rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .buy-color { color: var(--accent-green); text-shadow: 0 0 10px rgba(8,153,129,0.4); }
        .neutral-color { color: var(--text-main); }

        .controls {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            opacity: 0.85;
            transform: translateY(-1px);
        }

        .btn-sim-signal {
            background-color: var(--accent-blue);
            color: white;
            box-shadow: 0 4px 15px rgba(41, 98, 255, 0.4);
        }

        .btn-reset {
            background-color: #2a2e39;
            color: var(--text-main);
        }

        .footer-note {
            margin-top: 15px;
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-dim);
        }
    </style>
</head>
<body>

    <!-- Animated Background & Peeking Character Environment -->
    <div class="animated-bg"></div>
    <div id="particle-container"></div>
    <div class="peeking-character">
        <div class="eye-pupil pupil-left"></div>
        <div class="eye-pupil pupil-right"></div>
    </div>

    <!-- Main Terminal Dashboard -->
    <div class="terminal-container">
        <!-- Header with MT5 Countdown -->
        <div class="header">
            <h1>US500 AI Sniper Bot (1H)</h1>
            <div class="mt5-timer-box" id="mt5-timer">00:00:00</div>
        </div>

        <div class="content">
            <!-- Bot Status Banner -->
            <div id="status-banner" class="status-banner status-scanning">
                <span>Status: SCANNING MARKET SNIPER ZONES</span>
                <span id="state-badge">SEARCHING</span>
            </div>

            <!-- Metrics Grid -->
            <div class="grid-metrics">
                <div class="metric-card">
                    <div class="metric-label">US500 Index Price</div>
                    <div class="metric-value" id="current-price">7,689.24</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Market Bias</div>
                    <div class="metric-value" id="market-bias">BULLISH 📈</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Stop Loss (SL)</div>
                    <div class="metric-value" id="sl-value">--</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Take Profit (TP)</div>
                    <div class="metric-value" id="tp-value">--</div>
                </div>
            </div>

            <!-- Core Display Box -->
            <div class="signal-display-box">
                <div class="signal-title">ACTIVE DISPLAY / SIGNAL</div>
                <div class="signal-action neutral-color" id="signal-display">SCANNING FOR SETUP...</div>
            </div>

            <!-- Interactive Buttons -->
            <div class="controls">
                <button class="btn-sim-signal" onclick="triggerSniperEntry()">Simulate Sniper Entry</button>
                <button class="btn-reset" onclick="resetBotState()">Reset / Scan Mode</button>
            </div>

            <div class="footer-note">
                Strict 1H timeframe logic. Locks trade & holds until TP or SL is breached.
            </div>
        </div>
    </div>

    <script>
        // Generate Dynamic Background Floating Particles
        const particleContainer = document.getElementById('particle-container');
        for (let i = 0; i < 20; i++) {
            let p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + 'vw';
            p.style.width = (Math.random() * 6 + 4) + 'px';
            p.style.height = p.style.width;
            p.style.animationDuration = (Math.random() * 5 + 5) + 's';
            p.style.animationDelay = (Math.random() * 5) + 's';
            particleContainer.appendChild(p);
        }

        // Bot State Variables
        let inPosition = false;
        let livePrice = 7689.24;
        let lockedEntry = 0.00;
        let stopLoss = 0.00;
        let takeProfit = 0.00;

        // MT5 Style 1-Hour Candle Countdown Simulation
        function getSecondsToNextHour() {
            const now = new Date();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();
            return ((59 - minutes) * 60) + (60 - seconds);
        }

        let countdownSeconds = getSecondsToNextHour();

        function updateCountdownTimer() {
            let hours = Math.floor(countdownSeconds / 3600);
            let minutes = Math.floor((countdownSeconds % 3600) / 60);
            let seconds = countdownSeconds % 60;

            let formatted = 
                String(hours).padStart(2, '0') + ":" +
                String(minutes).padStart(2, '0') + ":" +
                String(seconds).padStart(2, '0');

            document.getElementById('mt5-timer').innerText = formatted;

            if (countdownSeconds > 0) {
                countdownSeconds--;
            } else {
                countdownSeconds = 3600;
            }
        }

        setInterval(updateCountdownTimer, 1000);
        updateCountdownTimer();

        // Live Price Ticker Simulation matching MT5 levels (~7689)
        setInterval(() => {
            let fluctuation = (Math.random() * 2 - 1).toFixed(2);
            livePrice = parseFloat((livePrice + parseFloat(fluctuation)).toFixed(2));
            
            document.getElementById('current-price').innerText = livePrice.toLocaleString();

            if (inPosition) {
                if (livePrice >= takeProfit) {
                    triggerClose("🎯 TAKE PROFIT HIT! Bot resetting...");
                } else if (livePrice <= stopLoss) {
                    triggerClose("🛑 STOP LOSS HIT! Bot resetting...");
                }
            }
        }, 2000);

        function triggerSniperEntry() {
            inPosition = true;
            lockedEntry = livePrice;
            
            stopLoss = parseFloat((lockedEntry - 25.00).toFixed(2));     // 25 points Risk
            takeProfit = parseFloat((lockedEntry + 75.00).toFixed(2));   // 75 points Reward (1:3)

            let banner = document.getElementById('status-banner');
            banner.className = "status-banner status-holding";
            banner.querySelector("span").innerText = "Status: POSITION LOCKED ACTIVE (HOLDING)";
            document.getElementById('state-badge').innerText = "ACTIVE TRADE";

            document.getElementById('sl-value').innerText = stopLoss.toLocaleString();
            document.getElementById('tp-value').innerText = takeProfit.toLocaleString();

            let signalBox = document.getElementById('signal-display');
            signalBox.className = "signal-action buy-color";
            signalBox.innerText = "HOLD LONG (Monitoring TP/SL)";
        }

        function triggerClose(message) {
            inPosition = false;
            let signalBox = document.getElementById('signal-display');
            signalBox.className = "signal-action neutral-color";
            signalBox.innerText = message;

            setTimeout(resetBotState, 4000);
        }

        function resetBotState() {
            inPosition = false;
            let banner = document.getElementById('status-banner');
            banner.className = "status-banner status-scanning";
            banner.querySelector("span").innerText = "Status: SCANNING MARKET SNIPER ZONES";
            document.getElementById('state-badge').innerText = "SEARCHING";

            document.getElementById('sl-value').innerText = "--";
            document.getElementById('tp-value').innerText = "--";

            let signalBox = document.getElementById('signal-display');
            signalBox.className = "signal-action neutral-color";
            signalBox.innerText = "SCANNING FOR SETUP...";
        }
    </script>
</body>
</html>
